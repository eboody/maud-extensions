[package]
name = "maud-extensions"
version = "0.6.7"
edition = "2024"
rust-version = "1.88"
description = "Component, inline CSS/JS, and font helper macros for Maud views."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eboody/maud-extensions"
homepage = "https://github.com/eboody/maud-extensions"
readme = "README.md"
keywords = ["maud", "macros", "css", "javascript", "html"]
categories = ["web-programming", "template-engine"]

[lib]
name = "maud_extensions"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
components = ["maud-extensions-macros/components"]

[dependencies]
bon = { version = "3.9", features = ["experimental-overwritable"] }
maud = "0.27"
maud-extensions-macros = { path = "maud-extensions-macros", version = "0.6.7" }

[dev-dependencies]
trybuild = "1.0.112"
