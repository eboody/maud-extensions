[package]
name = "maud-exts"
version = "0.1.0"
edition = "2024"
description = "Inline CSS, JS, and font helper macros for Maud views."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eboody/maud-exts"
homepage = "https://github.com/eboody/maud-exts"
readme = "README.md"
keywords = ["maud", "macros", "css", "javascript", "html"]
categories = ["web-programming", "template-engine"]

[lib]
name = "maud_exts"
proc-macro = true

[dependencies]
cssparser = "0.33.0"
proc-macro2 = "1.0.101"
quote = "1.0.41"
swc_common = "0.33.25"
swc_ecma_parser = "0.143.5"
syn = { version = "2.0.106", features = ["full"] }
